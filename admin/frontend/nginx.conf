# 管理端前端 Nginx 配置
# 容器内部监听 80，对外通过 docker-compose 映射到 3001
# 与 vite.config.ts 的 proxy 行为保持一致：/api → admin-backend:8003 ; /vocs → vocs-server:8001

server {
    listen       80;
    server_name  _;

    # ---- gzip ----
    gzip               on;
    gzip_min_length    1k;
    gzip_comp_level    5;
    gzip_types         text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary          on;

    # ---- SPA 静态资源 ----
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源加缓存（hash 文件名）
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- /api → 管理端后端 (admin-backend:8003) ----
    location /api/ {
        proxy_pass         http://admin-backend:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 兼容 SSE：关闭缓冲，超时拉长
        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        3600s;
        proxy_send_timeout        3600s;
        chunked_transfer_encoding on;
    }

    # ---- /vocs → ML 推理服务 (vocs-server:8001)，去掉 /vocs 前缀 ----
    location /vocs/ {
        rewrite ^/vocs/(.*)$ /$1 break;
        proxy_pass         http://vocs-server:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        3600s;
        proxy_send_timeout        3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查端点（供容器 healthcheck 直接使用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
