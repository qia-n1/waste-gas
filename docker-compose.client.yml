services:
  backend:
    build:
      context: ./client-backend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: docker.io
    container_name: waste-gas-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: VOCs Control Platform API
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      DEBUG: "false"
      CORS_ORIGINS: '["*"]'
      JWT_SECRET_KEY: replace-this-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      POSTGRES_DSN: sqlite+aiosqlite:///./data/vocs.db
      REDIS_URL: redis://redis:6379/0
      RAG_ENABLED: "false"
      CHROMA_PERSIST_DIR: ./chroma_data
    volumes:
      - backend_data:/app/data
      - backend_chroma:/app/chroma_data
    depends_on:
      - redis

  frontend:
    build:
      context: ./client-frontend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: docker.io
    container_name: waste-gas-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: waste-gas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  backend_data:
  backend_chroma:
  redis_data:
